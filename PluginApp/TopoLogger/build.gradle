plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace 'com.fabbri2025.topologger'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        minSdk 23

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}

tasks.register("buildAndCopy", Copy) {
    dependsOn 'assemble'
    from("${buildDir}/outputs/aar")
    include("${project.name}-release.aar")
    into("../../Moviles-TP2-Unity/Assets/Plugins/Android")

    doFirst{
        logger.lifecycle("Copying ${project.name}-release.aar to Unity project")
    }

    doLast{
        logger.lifecycle("Copied ${project.name}-release.aar to Moviles-TP2-Unity/Assets/Plugins/Android")
    }
}
